<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Sabbir Hub</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#1f2933;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
  main{max-width:420px;text-align:center;background:#fff;border:1px solid #dde3ee;border-radius:16px;padding:32px}
  h1{color:#0b1f44;font-size:1.5rem;margin:0 0 8px}
  button{min-height:44px;padding:10px 20px;border:0;border-radius:10px;background:#1d6bff;color:#fff;font:600 1rem inherit;cursor:pointer}
  :focus-visible{outline:3px solid #1d6bff;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>The project directory needs an internet connection the first time. Connect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
