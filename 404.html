<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Sabbir Hub</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#1f2933;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
  main{max-width:440px;text-align:center;background:#fff;border:1px solid #dde3ee;border-radius:16px;padding:32px}
  h1{color:#0b1f44;font-size:1.5rem;margin:0 0 8px}
  a{display:inline-flex;align-items:center;min-height:44px;padding:10px 20px;border-radius:10px;background:#1d6bff;color:#fff;font-weight:600;text-decoration:none}
  :focus-visible{outline:3px solid #0b1f44;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page doesn't exist. All projects are on the home page.</p>
  <!-- relative link: works for both USER.github.io/REPO/ and a custom domain -->
  <p><a id="home" href="./">Go to the project directory</a></p>
</main>
<script>
  // On project sites (USER.github.io/REPO/…) a mistyped sub-path should lead back to the repo root.
  (function(){var p=location.pathname.split('/').filter(Boolean);var a=document.getElementById('home');
   if(location.hostname.slice(-10)==='github.io'&&p.length){a.href='/'+p[0]+'/';}})();
</script>
</body>
</html>
